<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Loop de 6 s para la tarjeta de Capybara Learn & Play en la web del estudio:
         Capi (anteojos de sol) saluda y juega, y los juguetes giran a su alrededor en órbita.
         Todo es periódico dentro de los 6 s, así el loop no se nota. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #ff9b4a; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #ffe08a 0%, #ffb35c 50%, #ff8a3d 100%);
      }
      .capa { position: absolute; inset: 0; }
      #rayos {
        position: absolute;
        left: -260px;
        top: -280px;
        width: 1600px;
        height: 1600px;
        display: block;
        background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.16) 0deg 10deg, rgba(255, 255, 255, 0) 10deg 24deg);
        border-radius: 50%;
      }
      #puntos {
        background-image: radial-gradient(rgba(255, 255, 255, 0.35) 3px, transparent 3.5px);
        background-size: 46px 46px;
      }
      #orbita {
        position: absolute;
        left: 120px;
        top: 600px;
        width: 840px;
        height: 240px;
        border-radius: 50%;
        border: 5px dashed rgba(30, 42, 74, 0.25);
        display: block;
      }
      #sombra {
        position: absolute;
        left: 350px;
        top: 950px;
        width: 380px;
        height: 56px;
        border-radius: 50%;
        background: rgba(120, 50, 10, 0.3);
      }
      .capi { position: absolute; bottom: 100px; display: block; z-index: 2; }
      #capi-saluda { left: 345px; width: 400px; }
      #capi-juega { left: 380px; width: 330px; opacity: 0; }
      .juguete {
        position: absolute;
        left: 0;
        top: 0;
        width: 150px;
        height: 150px;
        display: block;
        object-fit: contain;
        filter: drop-shadow(5px 7px 0 rgba(30, 42, 74, 0.3));
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">
      <div data-hf-id="hf-zwj1" id="fondo" class="capa clip" data-start="0" data-duration="6" data-track-index="0">
        <div data-hf-id="hf-pgey" id="rayos" data-layout-allow-overflow=""></div>
        <div data-hf-id="hf-72ry" id="puntos" class="capa"></div>
      </div>

      <div data-hf-id="hf-e84f" id="escena" class="capa clip" data-start="0" data-duration="6" data-track-index="1">
        <div data-hf-id="hf-vgtk" id="orbita"></div>
        <div data-hf-id="hf-cesh" id="sombra"></div>
        <img data-hf-id="hf-ws15" id="capi-saluda" class="capi" src="assets/capi-saluda.png" alt="">
        <img data-hf-id="hf-5uy3" id="capi-juega" class="capi" src="assets/capi-juega.png" alt="">
        <img data-hf-id="hf-9fbg" id="j-crayola" class="juguete" src="assets/crayola.png" alt="">
        <img data-hf-id="hf-e85c" id="j-rompecabezas" class="juguete" src="assets/rompecabezas.png" alt="">
        <img data-hf-id="hf-0wow" id="j-globo" class="juguete" src="assets/globo.png" alt="">
        <img data-hf-id="hf-chmg" id="j-estrella" class="juguete" src="assets/estrella.png" alt="">
        <img data-hf-id="hf-1z5k" id="j-bloque" class="juguete" src="assets/bloque.png" alt="">
        <img data-hf-id="hf-asui" id="j-barrilete" class="juguete" src="assets/barrilete.png" alt="">
      </div>
    </div>

    <script>
      const PERIODO = 6;
      const PASO = 0.125;
      const tl = gsap.timeline({ paused: true });

      // Fondo: los rayos giran un período (24°) por loop
      tl.fromTo("#rayos", { rotation: 0 }, { rotation: 24, duration: PERIODO, ease: "none" }, 0);

      // Capi: saluda los primeros 3 s y juega los otros 3, con un saltito al cambiar
      tl.set("#capi-saluda", { opacity: 1 }, 0).set("#capi-juega", { opacity: 0 }, 0);
      tl.set("#capi-saluda", { opacity: 0 }, 3).set("#capi-juega", { opacity: 1 }, 3);
      tl.fromTo(".capi", { y: 0 }, { y: -18, duration: 0.375, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0);
      tl.fromTo("#sombra", { scaleX: 1 }, { scaleX: 0.88, duration: 0.375, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0);

      // Juguetes: una vuelta completa a la órbita por loop; adelante de Capi en la mitad de
      // abajo de la elipse y detrás en la de arriba (más chicos)
      const C = { x: 540, y: 720 };
      const R = { x: 420, y: 120 };
      const n = Math.round(PERIODO / PASO);
      gsap.utils.toArray(".juguete").forEach((el, i) => {
        const fase = (i / 6) * Math.PI * 2;
        const estado = (k) => {
          const a = fase + (k / n) * Math.PI * 2;
          const adelante = Math.sin(a);
          return {
            x: C.x + Math.cos(a) * R.x - 75,
            y: C.y + adelante * R.y - 75 + Math.sin(a * 3) * 14,
            scale: 0.8 + 0.3 * (adelante + 1) / 2,
            rotation: Math.sin(a * 2 + i) * 14,
          };
        };
        let zPrevio = null;
        for (let k = 0; k < n; k++) {
          tl.fromTo(el, estado(k), { ...estado(k + 1), duration: PASO, ease: "none", immediateRender: false }, k * PASO);
          const z = Math.sin(fase + ((k + 0.5) / n) * Math.PI * 2) > 0 ? 3 : 1;
          if (z !== zPrevio) {
            tl.set(el, { zIndex: z }, k * PASO);
            zPrevio = z;
          }
        }
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
