<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Presentación del estudio (10 s, 16:9) para la sección Nosotros de la web: aparece el koi,
         llegan las dos apps con sus Capis y cierra con el nombre. Termina en el estanque vacío
         del principio, así puede ir en loop. */
      @font-face {
        font-family: "Luckiest Guy";
        src: url("assets/LuckiestGuy-Regular.ttf") format("truetype");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #13b5aa; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, #7fe8dc 0%, #13b5aa 48%, #0a6c78 100%);
      }
      .capa { position: absolute; inset: 0; }
      .onda {
        position: absolute;
        left: 660px;
        top: 160px;
        width: 600px;
        height: 600px;
        display: block;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.5);
        opacity: 0;
      }
      .burbuja {
        position: absolute;
        display: block;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.8);
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.1) 50%, transparent 70%);
      }
      .koi-nada { position: absolute; display: block; width: 300px; height: 150px; }
      #koi {
        position: absolute;
        left: 780px;
        top: 160px;
        width: 360px;
        height: 360px;
        display: block;
        border-radius: 50%;
        border: 8px solid #1e2a4a;
        box-shadow: 12px 14px 0 #1e2a4a;
      }
      .app {
        position: absolute;
        top: 250px;
        width: 260px;
        height: 260px;
        display: block;
        border-radius: 56px;
        border: 7px solid #1e2a4a;
        box-shadow: 10px 12px 0 #1e2a4a;
      }
      #app-music { left: 330px; }
      #app-learn { left: 1330px; }
      .capi { position: absolute; bottom: -40px; display: block; }
      #capi-director { left: 60px; width: 250px; }
      #capi-aviador { left: 1620px; width: 230px; }
      #titulo {
        position: absolute;
        left: 0;
        right: 0;
        top: 585px;
        display: flex;
        justify-content: center;
        gap: 38px;
        font-family: "Luckiest Guy", sans-serif;
        font-size: 132px;
        line-height: 1;
        color: #fffdf6;
        -webkit-text-stroke: 9px #1e2a4a;
        paint-order: stroke fill;
        text-shadow: 0 12px 0 #1e2a4a;
      }
      .palabra { display: block; white-space: nowrap; }
      .letra { display: inline-block; }
      .sol { color: #ffc83d; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div data-hf-id="hf-ya2w" id="fondo" class="capa clip" data-start="0" data-duration="10" data-track-index="0">
        <div data-hf-id="hf-7qgh" id="onda-0" class="onda"></div>
        <div data-hf-id="hf-6yso" id="onda-1" class="onda"></div>
        <div data-hf-id="hf-fmoj" id="onda-2" class="onda"></div>
        <div data-hf-id="hf-d50k" class="burbuja" id="b0" style="left: 140px; top: 1100px; width: 44px; height: 44px"></div>
        <div data-hf-id="hf-dasz" class="burbuja" id="b1" style="left: 520px; top: 1100px; width: 26px; height: 26px"></div>
        <div data-hf-id="hf-i5am" class="burbuja" id="b2" style="left: 980px; top: 1100px; width: 36px; height: 36px"></div>
        <div data-hf-id="hf-wyfv" class="burbuja" id="b3" style="left: 1440px; top: 1100px; width: 50px; height: 50px"></div>
        <div data-hf-id="hf-m0wv" class="burbuja" id="b4" style="left: 1760px; top: 1100px; width: 30px; height: 30px"></div>
        <svg data-hf-id="hf-upvg" id="koi-a" class="koi-nada" viewBox="0 0 220 110" style="left: 0; top: 860px">
          <g data-hf-id="hf-dnu5" stroke="#1e2a4a" stroke-width="4" stroke-linejoin="round">
            <path data-hf-id="hf-vo07" d="M52 55 C34 34 14 26 4 30 C16 44 18 50 12 55 C18 60 16 66 4 80 C14 84 34 76 52 55 Z" fill="#ffd9c4" />
            <path data-hf-id="hf-s7rw" d="M112 34 C104 14 88 8 78 12 C86 22 92 30 96 40 Z" fill="#ffd9c4" />
            <path data-hf-id="hf-2owx" d="M112 76 C104 96 88 102 78 98 C86 88 92 80 96 70 Z" fill="#ffd9c4" />
            <path data-hf-id="hf-jna4" d="M48 55 C70 26 132 22 178 34 C206 41 214 50 214 55 C214 60 206 69 178 76 C132 88 70 84 48 55 Z" fill="#fffdf6" />
          </g>
          <path data-hf-id="hf-a37y" d="M120 30 C138 26 160 30 168 40 C158 50 132 48 120 40 Z" fill="#ff5a36" />
          <path data-hf-id="hf-tl5c" d="M86 60 C100 54 118 58 124 70 C112 78 94 76 86 70 Z" fill="#ff5a36" />
          <circle data-hf-id="hf-1r06" cx="196" cy="45" r="4" fill="#1e2a4a" /><circle data-hf-id="hf-re4w" cx="196" cy="65" r="4" fill="#1e2a4a" />
        </svg>
      </div>

      <div data-hf-id="hf-15x0" id="escena" class="capa clip" data-start="0" data-duration="10" data-track-index="1">
        <img data-hf-id="hf-tsy5" id="capi-director" class="capi" src="assets/capi-director.png" alt="">
        <img data-hf-id="hf-yz2n" id="capi-aviador" class="capi" src="assets/capi-aviador.png" alt="">
        <img data-hf-id="hf-r048" id="app-music" class="app" src="assets/capibara-music-icono.png" alt="">
        <img data-hf-id="hf-z4pp" id="app-learn" class="app" src="assets/learn-play-icono.png" alt="">
        <img data-hf-id="hf-7shx" id="koi" src="assets/koi.png" alt="">
        <div data-hf-id="hf-hyey" id="titulo">
          <span data-hf-id="hf-mima" class="palabra"><span data-hf-id="hf-j0vo" class="letra">K</span><span data-hf-id="hf-xbwo" class="letra">o</span><span data-hf-id="hf-uy2i" class="letra">i</span></span>
          <span data-hf-id="hf-wl1s" class="palabra sol"><span data-hf-id="hf-mzxy" class="letra">E</span><span data-hf-id="hf-zbft" class="letra">d</span><span data-hf-id="hf-62na" class="letra">u</span><span data-hf-id="hf-yx4s" class="letra">c</span><span data-hf-id="hf-y4iq" class="letra">a</span><span data-hf-id="hf-5oc9" class="letra">t</span><span data-hf-id="hf-t866" class="letra">i</span><span data-hf-id="hf-8fsw" class="letra">o</span><span data-hf-id="hf-wxln" class="letra">n</span><span data-hf-id="hf-ma12" class="letra">a</span><span data-hf-id="hf-w4zl" class="letra">l</span></span>
          <span data-hf-id="hf-ojs6" class="palabra"><span data-hf-id="hf-nsk0" class="letra">G</span><span data-hf-id="hf-moc3" class="letra">a</span><span data-hf-id="hf-wjam" class="letra">m</span><span data-hf-id="hf-zpqu" class="letra">e</span><span data-hf-id="hf-5a18" class="letra">s</span></span>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Estanque: ondas que se abren en loop, burbujas que suben y un koi que cruza
      [0, 1, 2].forEach((i) =>
        tl.fromTo(`#onda-${i}`, { scale: 0.3, opacity: 0.8 }, { scale: 2.2, opacity: 0, duration: 3.2, ease: "power1.out", repeat: 2 }, 0.2 + i * 1.07),
      );
      [0, 1, 2, 3, 4].forEach((i) =>
        tl.fromTo(`#b${i}`, { y: 0, x: 0 }, { y: -1300, x: i % 2 ? 40 : -40, duration: 5 + (i % 3), ease: "none", repeat: 1 }, (i * 0.9) % 4),
      );
      tl.fromTo("#koi-a", { x: -320, rotation: -4 }, { x: 2000, rotation: 4, duration: 10, ease: "none" }, 0);

      // 1) El koi aparece girando, con rebote
      tl.fromTo("#koi", { scale: 0, rotation: -200 }, { scale: 1, rotation: 0, duration: 1.1, ease: "back.out(1.7)" }, 0.2);

      // 2) Llegan las apps (stickers inclinados) y sus Capis asoman desde abajo
      tl.fromTo("#app-music", { scale: 0, rotation: -30 }, { scale: 1, rotation: -8, duration: 0.8, ease: "back.out(2)" }, 1.6);
      tl.fromTo("#app-learn", { scale: 0, rotation: 30 }, { scale: 1, rotation: 8, duration: 0.8, ease: "back.out(2)" }, 1.9);
      tl.fromTo("#capi-director", { y: 520 }, { y: 0, duration: 0.9, ease: "back.out(1.4)" }, 2.5);
      tl.fromTo("#capi-aviador", { y: 520 }, { y: 0, duration: 0.9, ease: "back.out(1.4)" }, 2.75);

      // 3) El nombre, letra por letra
      tl.fromTo(
        "#titulo .letra",
        { y: -260, rotation: (i) => ((i * 37) % 50) - 25, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.8, ease: "bounce.out", stagger: 0.045 },
        3.6,
      );

      // Mientras tanto todo flota un poco
      tl.to("#app-music", { y: -18, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.4);
      tl.to("#app-learn", { y: -18, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.7);
      tl.to("#koi", { rotation: 8, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.4);

      // 4) Salida: todo se achica y se va; queda el estanque vacío como al principio
      tl.to(["#koi", "#app-music", "#app-learn", "#titulo"], { scale: 0.6, opacity: 0, duration: 0.7, ease: "back.in(1.6)", stagger: 0.08 }, 8.7);
      tl.to(["#capi-director", "#capi-aviador"], { y: 520, duration: 0.7, ease: "back.in(1.4)" }, 8.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
